<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antibody review</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c2733; --muted: #6b7a89;
    --line: #dde3e9; --accent: #d14d1f; --accent-soft: #fdf1ea;
    --good: #23744f; --good-soft: #ecf6f1; --bad: #b93b3b; --bad-soft: #fbeeee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f161d; --card: #161f28; --ink: #e7ecf1; --muted: #8fa0af;
      --line: #2a3540; --accent: #f0703f; --accent-soft: #33231c;
      --good: #4fbe8c; --good-soft: #1a2b24; --bad: #e36a6a; --bad-soft: #301d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 1.4rem 1.2rem 5rem; }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 1rem; flex-wrap: wrap;
  }
  header .brand { font-family: ui-monospace, monospace; font-weight: 700; color: var(--accent); }
  header .brand span { color: var(--muted); font-weight: 400; }
  #progress { font-size: .85rem; color: var(--muted); }

  .question { margin: 1.6rem 0 .2rem; font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
  .hint { color: var(--muted); font-size: .9rem; margin-bottom: 1.4rem; }

  /* the conversation */
  .msg { margin: 0 0 1rem; }
  .msg .who {
    font-size: .72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin-bottom: .2rem;
  }
  .msg .bubble {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: .65rem .85rem; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .who { color: var(--accent); }
  .msg.assistant .bubble { border-left: 3px solid var(--accent); }
  .msg.system { margin: 0 0 .8rem; }
  .msg.system .who { display: none; }
  .msg.system .bubble {
    background: none; border: none; padding: 0; color: var(--muted); font-size: .85rem;
  }

  /* robot suggestion card */
  .suggestion {
    border: 1.5px dashed var(--accent); background: var(--accent-soft);
    border-radius: 10px; padding: .8rem .9rem; margin: 1.2rem 0;
  }
  .suggestion .tag {
    font-size: .72rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--accent); margin-bottom: .3rem;
  }
  .suggestion .claim { margin-bottom: .1rem; }
  .suggestion .quote { color: var(--muted); font-size: .9rem; }
  .suggestion .row { margin-top: .6rem; }

  /* controls */
  .panel {
    position: sticky; bottom: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: .9rem 0 .5rem; margin-top: 1.6rem;
  }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-size: .95rem; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); padding: .55rem 1rem; cursor: pointer;
  }
  button.bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 700; }
  button.ok { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 700; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=text] {
    flex: 1; min-width: 220px; background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: .55rem .75rem; font: inherit; font-size: .95rem;
  }
  select {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: .55rem .6rem; font: inherit; font-size: .9rem; max-width: 15rem;
  }
  .keys {
    margin-top: .6rem; font-size: .78rem; color: var(--muted);
    display: flex; gap: 1rem; flex-wrap: wrap;
  }
  kbd {
    font-family: ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 .35em; background: var(--card);
  }
  .toast {
    position: fixed; top: .8rem; right: .8rem; background: var(--accent-soft);
    color: var(--ink); border: 1px solid var(--accent); border-radius: 10px;
    padding: .45rem .85rem; font-size: .9rem; opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .done { text-align: center; color: var(--muted); padding: 4rem 0; font-size: 1.05rem; }
  .already { color: var(--muted); font-size: .82rem; margin-bottom: .8rem; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">&#9873; antibody <span>review</span></span>
    <span id="progress">loading…</span>
  </header>

  <div class="question">Did the AI get this wrong?</div>
  <div class="hint">Read the exchange, then answer below. Unsure? Skip it with <kbd>j</kbd> — only confident answers count.</div>

  <main id="trace"></main>

  <div class="panel">
    <div class="row">
      <button class="bad" id="btn-bad" title="keyboard: f">✗ Something's wrong</button>
      <button class="ok" id="btn-ok" title="keyboard: o">✓ Looks fine</button>
      <select id="fm" title="If this is a mistake you've already named, pick it — that teaches its checker.">
        <option value="">a named mistake? (optional)</option>
      </select>
    </div>
    <div class="row" style="margin-top:.5rem">
      <input type="text" id="note" placeholder="what's wrong, in your own words? (optional)">
    </div>
    <div class="keys">
      <span><kbd>f</kbd> wrong</span><span><kbd>o</kbd> fine</span>
      <span><kbd>a</kbd>/<kbd>x</kbd> answer the checker</span>
      <span><kbd>n</kbd> note</span><span><kbd>j</kbd>/<kbd>k</kbd> skip / back</span>
      <span><kbd>u</kbd> include answered</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  let state = null, queue = [], idx = 0, showReviewed = false;
  const $ = (id) => document.getElementById(id);

  // Plain-words labels for the technical role names in stored traces.
  const WHO = { user: 'They wrote', assistant: 'The AI said', tool: 'Tool result', system: '' };

  async function load() {
    state = await (await fetch('/api/state')).json();
    const fmSel = $('fm');
    fmSel.length = 1;
    for (const fm of state.fms) {
      const o = document.createElement('option');
      o.value = fm.id; o.textContent = fm.name.replaceAll('-', ' ');
      fmSel.append(o);
    }
    rebuildQueue();
    render();
  }

  function rebuildQueue() {
    const mine = (t) => t.reviewers.some((r) => r.by === state.me);
    const anyone = (t) => t.reviewers.length > 0;
    queue = state.traces.filter((t) => showReviewed ? true : !anyone(t));
    // checker questions first (they unblock calibration), then unanswered
    const hasSug = (t) => (state.suggestions[t.id] || []).length > 0;
    queue.sort((a, b) => (hasSug(b) - hasSug(a)) || (anyone(a) - anyone(b)) || (mine(a) - mine(b)));
    idx = Math.min(idx, Math.max(0, queue.length - 1));
  }

  async function render() {
    let answered = 0;
    for (const t of state.traces) if (t.reviewers.some((r) => r.by === state.me)) answered++;
    const sugCount = Object.values(state.suggestions).reduce((n, arr) => n + arr.length, 0);
    $('progress').textContent = queue.length
      ? `${idx + 1} of ${queue.length} to review · ${answered} answered` +
        (sugCount ? ` · ${sugCount} checker questions` : '')
      : `${answered} answered`;

    const main = $('trace');
    if (!queue.length) {
      main.innerHTML = '<div class="done">All done — everything here has your answer.<br>' +
        'More arrives next time traces are imported. (<kbd>u</kbd> revisits answered ones.)</div>';
      return;
    }
    const meta = queue[idx];
    const trace = await (await fetch('/api/trace?id=' + meta.id)).json();
    let html = '';
    if (meta.reviewers.length) {
      html += `<div class="already">already answered by ${meta.reviewers.map((r) => `${r.by} (${r.verdict === 'bad' ? 'wrong' : 'fine'})`).join(', ')}</div>`;
    }
    trace.messages.forEach((m) => {
      const who = WHO[m.role] ?? m.role;
      html += `<div class="msg ${m.role}">` +
        (who ? `<div class="who">${who}</div>` : '') +
        `<div class="bubble">${escapeHtml(m.content)}</div></div>`;
    });
    for (const s of state.suggestions[meta.id] || []) {
      // hide rule internals ("— matched /…/") behind a tooltip; lead with the quote
      const quote = (s.reason || '').replace(/\s*—\s*matched \/.*\/$/, '');
      html += `<div class="suggestion" title="${escapeHtml(s.reason || '')}">` +
        `<div class="tag">the checker has a question</div>` +
        `<div class="claim">This looks like <b>${escapeHtml(s.name.replaceAll('-', ' '))}</b> — a mistake you've flagged before.</div>` +
        (quote ? `<div class="quote">It noticed: ${escapeHtml(quote)}</div>` : '') +
        `<div class="row"><button class="bad" onclick="resolveSuggestion('${meta.id}','${s.fm}','accept')">Yes, that mistake</button>` +
        `<button onclick="resolveSuggestion('${meta.id}','${s.fm}','dismiss')">No, it's not</button></div></div>`;
    }
    main.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function submit(verdict) {
    if (!queue.length) return;
    const t = queue[idx];
    await fetch('/api/verdict', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ trace: t.id, verdict, note: $('note').value.trim(), fm: $('fm').value || null }),
    });
    toast(verdict === 'bad' ? '✗ marked wrong' : '✓ marked fine');
    $('note').value = ''; $('fm').value = '';
    t.reviewers.push({ by: state.me, verdict });
    if (!showReviewed) { queue.splice(idx, 1); idx = Math.min(idx, queue.length - 1); }
    else idx = Math.min(idx + 1, queue.length - 1);
    render();
  }

  async function resolveSuggestion(traceId, fm, action) {
    await fetch('/api/suggestion', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ trace: traceId, fm, action, note: $('note').value.trim() }),
    });
    const list = state.suggestions[traceId] || [];
    state.suggestions[traceId] = list.filter((s) => s.fm !== fm);
    toast(action === 'accept' ? '✗ marked wrong — the checker was right' : 'noted — not that mistake');
    $('note').value = '';
    if (action === 'accept') {
      const t = state.traces.find((t) => t.id === traceId);
      if (t) t.reviewers.push({ by: state.me, verdict: 'bad' });
      if (!showReviewed) rebuildQueue();
    }
    render();
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1400);
  }

  $('btn-bad').onclick = () => submit('bad');
  $('btn-ok').onclick = () => submit('ok');
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
      if (e.key === 'Enter' && e.target.id === 'note') { e.preventDefault(); submit('bad'); }
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    const sugs = queue.length ? (state.suggestions[queue[idx].id] || []) : [];
    if (e.key === 'a' && sugs.length) resolveSuggestion(queue[idx].id, sugs[0].fm, 'accept');
    else if (e.key === 'x' && sugs.length) resolveSuggestion(queue[idx].id, sugs[0].fm, 'dismiss');
    else if (e.key === 'f') submit('bad');
    else if (e.key === 'o') submit('ok');
    else if (e.key === 'n') { e.preventDefault(); $('note').focus(); }
    else if (e.key === 'j') { idx = Math.min(idx + 1, queue.length - 1); render(); }
    else if (e.key === 'k') { idx = Math.max(idx - 1, 0); render(); }
    else if (e.key === 'u') { showReviewed = !showReviewed; rebuildQueue(); render(); toast(showReviewed ? 'including answered ones' : 'unanswered only'); }
  });

  load();
</script>
</body>
</html>
