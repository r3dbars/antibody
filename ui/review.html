<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antibody review</title>
<style>
  :root {
    --bg: #f2f4f6; --card: #ffffff; --ink: #1c2733; --muted: #5c6c7c;
    --line: #d8dee4; --accent: #d14d1f; --accent-soft: #fbe9e0;
    --good: #23744f; --bad: #b93b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f161d; --card: #161f28; --ink: #e7ecf1; --muted: #8fa0af;
      --line: #2a3540; --accent: #f0703f; --accent-soft: #35231b;
      --good: #4fbe8c; --bad: #e36a6a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem;
    font-family: ui-monospace, monospace; font-size: .8rem; color: var(--muted);
  }
  header b { color: var(--accent); font-size: .95rem; }
  .msg { display: flex; gap: .6rem; margin-bottom: .7rem; }
  .who {
    flex: 0 0 4.6rem; font-family: ui-monospace, monospace; font-size: .68rem;
    text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
    padding-top: .45rem; text-align: right;
  }
  .bubble {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: .5rem .75rem; white-space: pre-wrap; word-break: break-word;
    min-width: 0; flex: 1;
  }
  .msg.assistant .bubble { border-left: 3px solid var(--line); }
  .msg .lineno { color: var(--muted); font-family: ui-monospace, monospace; font-size: .7rem; margin-right: .4rem; }
  .panel {
    position: sticky; bottom: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: .8rem 0 .4rem; margin-top: 1.2rem;
  }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input[type=text], select {
    flex: 1; min-width: 200px; background: var(--card); color: var(--ink);
    border: 1px dashed var(--accent); border-radius: 8px; padding: .5rem .7rem;
    font: inherit;
  }
  select { flex: 0 1 auto; border-style: solid; border-color: var(--line); }
  button {
    font: inherit; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); padding: .5rem .9rem; cursor: pointer;
  }
  button.bad { border-color: var(--bad); color: var(--bad); font-weight: 700; }
  button.ok { border-color: var(--good); color: var(--good); font-weight: 700; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .keys {
    margin-top: .5rem; font-family: ui-monospace, monospace; font-size: .72rem;
    color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap;
  }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3em; background: var(--card); }
  .toast {
    position: fixed; top: .8rem; right: .8rem; background: var(--accent-soft);
    color: var(--ink); border: 1px solid var(--accent); border-radius: 8px;
    padding: .4rem .8rem; font-size: .85rem; opacity: 0; transition: opacity .2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .done { text-align: center; color: var(--muted); padding: 4rem 0; }
  .reviewed-note { color: var(--muted); font-size: .78rem; margin-bottom: .6rem; }
  @media (max-width: 540px) {
    .msg { flex-direction: column; gap: .15rem; }
    .who { text-align: left; padding-top: 0; flex-basis: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span><b>&#9873; antibody</b> review</span>
    <span id="progress">loading…</span>
  </header>
  <main id="trace"></main>
  <div class="panel">
    <div class="row">
      <button class="bad" id="btn-bad" title="f">✗ flag (f)</button>
      <button class="ok" id="btn-ok" title="o">✓ looks fine (o)</button>
      <select id="fm" title="attribute to a known failure mode (optional)">
        <option value="">no known FM</option>
      </select>
    </div>
    <div class="row" style="margin-top:.5rem">
      <input type="text" id="note" placeholder="one-line note — what's wrong here? (n to focus)">
    </div>
    <div class="keys">
      <span><kbd>f</kbd> flag</span><span><kbd>o</kbd> fine</span>
      <span><kbd>n</kbd> note</span><span><kbd>j</kbd>/<kbd>k</kbd> next/prev</span>
      <span><kbd>u</kbd> show reviewed too</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  let state = null, queue = [], idx = 0, showReviewed = false;
  const $ = (id) => document.getElementById(id);

  async function load() {
    state = await (await fetch('/api/state')).json();
    const fmSel = $('fm');
    fmSel.length = 1;
    for (const fm of state.fms) {
      const o = document.createElement('option');
      o.value = fm.id; o.textContent = `${fm.id} ${fm.name}`;
      fmSel.append(o);
    }
    rebuildQueue();
    render();
  }

  function rebuildQueue() {
    const mine = (t) => t.reviewers.some((r) => r.by === state.me);
    const anyone = (t) => t.reviewers.length > 0;
    queue = state.traces.filter((t) => showReviewed ? true : !anyone(t));
    // unclaimed first, then teammates', then mine
    queue.sort((a, b) => (anyone(a) - anyone(b)) || (mine(a) - mine(b)));
    idx = Math.min(idx, Math.max(0, queue.length - 1));
  }

  async function render() {
    const counts = { me: 0, others: 0, unclaimed: 0 };
    const others = new Set();
    for (const t of state.traces) {
      const byMe = t.reviewers.some((r) => r.by === state.me);
      const byOther = t.reviewers.some((r) => r.by !== state.me);
      if (byMe) counts.me++;
      if (byOther) { counts.others++; t.reviewers.forEach((r) => r.by !== state.me && others.add(r.by)); }
      if (!t.reviewers.length) counts.unclaimed++;
    }
    const otherLabel = others.size ? [...others].join(', ') : 'teammates';
    $('progress').textContent =
      `you ${counts.me} · ${otherLabel} ${counts.others} · ${counts.unclaimed} unclaimed`;

    const main = $('trace');
    if (!queue.length) {
      main.innerHTML = '<div class="done">queue clear — every trace has a verdict.<br>next: <code>antibody distill</code> (or press <b>u</b> to re-review)</div>';
      return;
    }
    const meta = queue[idx];
    const trace = await (await fetch('/api/trace?id=' + meta.id)).json();
    let html = `<div class="reviewed-note">${meta.id} · ${trace.source || ''} · ${idx + 1} of ${queue.length}` +
      (meta.reviewers.length ? ` · already reviewed by ${meta.reviewers.map((r) => `${r.by} (${r.verdict})`).join(', ')}` : '') + '</div>';
    trace.messages.forEach((m, i) => {
      html += `<div class="msg ${m.role}"><div class="who">${m.role}</div>` +
        `<div class="bubble"><span class="lineno">${i + 1}</span>${escapeHtml(m.content)}</div></div>`;
    });
    main.innerHTML = html;
    window.scrollTo(0, 0);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  async function submit(verdict) {
    if (!queue.length) return;
    const t = queue[idx];
    await fetch('/api/verdict', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ trace: t.id, verdict, note: $('note').value.trim(), fm: $('fm').value || null }),
    });
    toast(`${verdict === 'bad' ? '✗ flagged' : '✓ fine'} — ${t.id}`);
    $('note').value = ''; $('fm').value = '';
    t.reviewers.push({ by: state.me, verdict });
    if (!showReviewed) { queue.splice(idx, 1); idx = Math.min(idx, queue.length - 1); }
    else idx = Math.min(idx + 1, queue.length - 1);
    render();
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1400);
  }

  $('btn-bad').onclick = () => submit('bad');
  $('btn-ok').onclick = () => submit('ok');
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
      if (e.key === 'Enter' && e.target.id === 'note') { e.preventDefault(); submit('bad'); }
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.key === 'f') submit('bad');
    else if (e.key === 'o') submit('ok');
    else if (e.key === 'n') { e.preventDefault(); $('note').focus(); }
    else if (e.key === 'j') { idx = Math.min(idx + 1, queue.length - 1); render(); }
    else if (e.key === 'k') { idx = Math.max(idx - 1, 0); render(); }
    else if (e.key === 'u') { showReviewed = !showReviewed; rebuildQueue(); render(); toast(showReviewed ? 'showing reviewed traces too' : 'unreviewed only'); }
  });

  load();
</script>
</body>
</html>
