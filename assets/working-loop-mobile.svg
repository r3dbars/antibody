<svg xmlns="http://www.w3.org/2000/svg" width="600" height="680" viewBox="0 0 600 680" role="img" aria-labelledby="title desc">
  <title id="title">The Antibody working loop</title>
  <desc id="desc">Review real conversations, flag a failure, distill it into a reusable pattern, and scan future conversations.</desc>
  <rect x="1" y="1" width="598" height="678" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(48 48)">
      <text fill="#F05A28" font-size="17" font-weight="700">01</text>
      <text x="74" y="10" fill="#F0F3F6" font-size="31" font-weight="700">REVIEW</text>
      <text x="74" y="42" fill="#9DA7B3" font-size="17">real conversations</text>
    </g>
    <line x1="48" y1="132" x2="552" y2="132" stroke="#30363D" stroke-width="2"/>

    <g transform="translate(48 173)">
      <text fill="#F05A28" font-size="17" font-weight="700">02</text>
      <text x="74" y="10" fill="#F0F3F6" font-size="31" font-weight="700">FLAG</text>
      <text x="74" y="42" fill="#9DA7B3" font-size="17">name the failure</text>
    </g>
    <line x1="48" y1="257" x2="552" y2="257" stroke="#30363D" stroke-width="2"/>

    <g transform="translate(48 298)">
      <text fill="#F05A28" font-size="17" font-weight="700">03</text>
      <text x="74" y="10" fill="#F0F3F6" font-size="31" font-weight="700">DISTILL</text>
      <text x="74" y="42" fill="#9DA7B3" font-size="17">save the pattern</text>
    </g>
    <line x1="48" y1="382" x2="552" y2="382" stroke="#30363D" stroke-width="2"/>

    <g transform="translate(48 423)">
      <text fill="#F05A28" font-size="17" font-weight="700">04</text>
      <text x="74" y="10" fill="#F0F3F6" font-size="31" font-weight="700">SCAN</text>
      <text x="74" y="42" fill="#9DA7B3" font-size="17">catch the return</text>
    </g>

    <rect x="48" y="536" width="504" height="92" rx="10" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <text x="300" y="591" fill="#9DA7B3" font-size="17" text-anchor="middle"><tspan fill="#F05A28">↻</tspan><tspan dx="10">repeat with new conversations</tspan></text>
  </g>
</svg>
