<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Antibody checker trust ladder</title>
  <desc id="desc">A checker moves left to right from proposed, to report-only calibration, to trusted watching status after a human-reviewed commit.</desc>
  <rect x="1" y="1" width="1198" height="248" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(48 48)">
      <text fill="#F05A28" font-size="16" font-weight="700">PROPOSED</text>
      <text y="49" fill="#F0F3F6" font-size="30" font-weight="700">DRAFT ONLY</text>
      <text y="82" fill="#9DA7B3" font-size="16">cannot block CI</text>
    </g>

    <text x="352" y="105" fill="#F05A28" font-size="30" text-anchor="middle">→</text>

    <g transform="translate(398 48)">
      <text fill="#F05A28" font-size="16" font-weight="700">CALIBRATING</text>
      <text y="49" fill="#F0F3F6" font-size="30" font-weight="700">REPORTS ONLY</text>
      <text y="82" fill="#9DA7B3" font-size="16">cannot block CI</text>
    </g>

    <text x="748" y="105" fill="#F05A28" font-size="30" text-anchor="middle">→</text>
    <text x="748" y="136" fill="#9DA7B3" font-size="13" text-anchor="middle">human commit</text>

    <g transform="translate(800 32)">
      <rect width="352" height="116" rx="10" fill="#161B22" stroke="#F05A28" stroke-width="2"/>
      <text x="24" y="33" fill="#F05A28" font-size="16" font-weight="700">WATCHING</text>
      <text x="24" y="79" fill="#F0F3F6" font-size="30" font-weight="700">TRUSTED</text>
      <text x="24" y="103" fill="#F0F3F6" font-size="16" font-weight="700">may block CI</text>
    </g>

    <line x1="48" y1="165" x2="1152" y2="165" stroke="#30363D" stroke-width="2"/>
    <text x="600" y="208" fill="#9DA7B3" font-size="15" text-anchor="middle"><tspan fill="#F05A28">✓</tspan><tspan dx="10">Antibody can suggest promotion; only you can approve it</tspan></text>
  </g>
</svg>
