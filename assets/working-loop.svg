<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">The Antibody working loop</title>
  <desc id="desc">Review real conversations, flag a failure, distill it into a reusable pattern, and scan future conversations.</desc>
  <rect x="1" y="1" width="1198" height="248" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="translate(48 48)">
      <text fill="#F05A28" font-size="16" font-weight="700">01</text>
      <text y="49" fill="#F0F3F6" font-size="31" font-weight="700">REVIEW</text>
      <text y="82" fill="#9DA7B3" font-size="16">real conversations</text>
    </g>

    <text x="302" y="105" fill="#F05A28" font-size="30" text-anchor="middle">→</text>

    <g transform="translate(344 48)">
      <text fill="#F05A28" font-size="16" font-weight="700">02</text>
      <text y="49" fill="#F0F3F6" font-size="31" font-weight="700">FLAG</text>
      <text y="82" fill="#9DA7B3" font-size="16">name the failure</text>
    </g>

    <text x="598" y="105" fill="#F05A28" font-size="30" text-anchor="middle">→</text>

    <g transform="translate(640 48)">
      <text fill="#F05A28" font-size="16" font-weight="700">03</text>
      <text y="49" fill="#F0F3F6" font-size="31" font-weight="700">DISTILL</text>
      <text y="82" fill="#9DA7B3" font-size="16">save the pattern</text>
    </g>

    <text x="894" y="105" fill="#F05A28" font-size="30" text-anchor="middle">→</text>

    <g transform="translate(936 48)">
      <text fill="#F05A28" font-size="16" font-weight="700">04</text>
      <text y="49" fill="#F0F3F6" font-size="31" font-weight="700">SCAN</text>
      <text y="82" fill="#9DA7B3" font-size="16">catch the return</text>
    </g>

    <line x1="48" y1="165" x2="1152" y2="165" stroke="#30363D" stroke-width="2"/>
    <text x="600" y="208" fill="#9DA7B3" font-size="15" text-anchor="middle"><tspan fill="#F05A28">↻</tspan><tspan dx="10">repeat with new conversations</tspan></text>
  </g>
</svg>
