name: test
# Two lanes, mirroring antibody's own philosophy:
#   test        deterministic — lint + unit/e2e tests, runs everywhere, no key.
#   judge-quiz  non-deterministic — grades the example LLM judge against the
#               committed quiz cases (`antibody quiz`). A judge checker is only
#               allowed to gate CI while it keeps passing its quiz. Skips
#               cleanly on forks/PRs where the ANTHROPIC_API_KEY secret is
#               absent; the rule-checker quizzes still run keyless in `npm test`.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
  judge-quiz:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: quiz the graders
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "no ANTHROPIC_API_KEY secret — judge quiz skipped (rule quizzes still ran keyless in npm test)"
            exit 0
          fi
          ws="$(mktemp -d)" && cd "$ws"
          node "$GITHUB_WORKSPACE/src/cli.js" init
          cp "$GITHUB_WORKSPACE"/examples/registry/* .antibody/registry/
          cp -r "$GITHUB_WORKSPACE"/examples/quiz/* .antibody/quiz/
          node "$GITHUB_WORKSPACE/src/cli.js" quiz
